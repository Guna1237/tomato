name: tomato
description: Community-powered campus logistics platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Typography
  google_fonts: ^6.2.1

  # Animation
  flutter_animate: ^4.5.0

  # UI utilities
  gap: ^3.0.1

  # Local storage (for dark mode preference)
  shared_preferences: ^2.2.3

  # Backend
  supabase_flutter: ^2.5.0

  # Face detection (on-device, free)
  google_mlkit_face_detection: ^0.11.0

  # Image picking
  image_picker: ^1.1.2

  # Network image caching
  cached_network_image: ^3.3.1

  # Phone / URL dialing
  url_launcher: ^6.3.0

  # Interactive maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # GPS location for runner real-time tracking
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
