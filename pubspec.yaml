name: tomato
description: Community-powered campus logistics platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Typography
  google_fonts: ^6.2.1

  # Animation
  flutter_animate: ^4.5.0

  # UI utilities
  gap: ^3.0.1

  # Local storage (for dark mode preference)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
